[package]
name = "nx-netloader"
version = "0.1.0"
edition = "2024"
authors = ["LNSD"]

[dependencies]
flate2 = "1.0"
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "time"] }
tracing = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
